[project]
name = "audio-to-text"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Michael Kingston", email = "71872141+mkingopng@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "pyannote-audio>=4.0.7",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Load-bearing, not boilerplate: without a build backend uv treats this as a
# virtual project and never installs it onto .venv's import path, so
# `python -m audio_to_text.transcribe` -- what the PATH wrapper calls -- can't resolve.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
audio-to-text = "audio_to_text.transcribe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_to_text"]
